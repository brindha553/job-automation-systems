version: '3.8'

services:
  web:
    build: .
    container_name: talentmatch-web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-talentmatch-super-secret-key-prod}
      - DATABASE_URL=sqlite:////app/database/talentmatch.db
    volumes:
      - talentmatch_db:/app/database
      - talentmatch_uploads:/app/uploads
      - talentmatch_logs:/app/logs
    networks:
      - talentmatch_network

  nginx:
    image: nginx:alpine
    container_name: talentmatch-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web
    networks:
      - talentmatch_network

volumes:
  talentmatch_db:
  talentmatch_uploads:
  talentmatch_logs:

networks:
  talentmatch_network:
